<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة مسح وختم الموظف — ختم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3050">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker Registered successfully.', reg.scope))
        .catch(err => console.log('Service Worker registration failed:', err));
    });
  }
</script>
<style>
  body {
    background: var(--parchment);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .scanner-card {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 24px;
    padding: 34px 28px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 30px 60px -15px rgba(22,35,63,0.25);
    text-align: center;
  }
  .scanner-title {
    font-family: 'Cairo', sans-serif;
    font-weight: 900;
    font-size: 1.6rem;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .scanner-subtitle {
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin-bottom: 30px;
  }
  .camera-box {
    background: #111;
    border-radius: 16px;
    height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    position: relative;
    overflow: hidden;
    border: 2.5px solid var(--ink);
    margin-bottom: 24px;
  }
  .scan-laser {
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: var(--stamp);
    box-shadow: 0 0 10px var(--stamp);
    animation: laserMove 2.2s ease-in-out infinite;
  }
  @keyframes laserMove {
    0% { top: 10%; }
    50% { top: 90%; }
    100% { top: 10%; }
  }
  .manual-input-box {
    margin-bottom: 26px;
  }
  .manual-input-box input {
    width: 100%;
    padding: 13px;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    background: var(--parchment);
  }
  .manual-input-box input:focus {
    outline: none;
    background: #fff;
    border-color: var(--brass);
  }
  .stamp-button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .stamp-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--stamp);
    color: var(--parchment);
    font-family: 'Cairo', sans-serif;
    font-weight: 900;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 5px solid var(--ink);
    box-shadow: 0 12px 0 var(--ink);
    transition: all 0.1s ease;
    user-select: none;
  }
  .stamp-btn:active {
    transform: translateY(10px);
    box-shadow: 0 2px 0 var(--ink);
  }
  .seal-ink {
    opacity: 0;
    transform: scale(3);
    color: var(--stamp);
    font-family: 'Cairo', sans-serif;
    font-weight: 900;
    font-size: 1.5rem;
    border: 4px solid var(--stamp);
    padding: 4px 14px;
    border-radius: 8px;
    display: inline-block;
    margin-top: 15px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .seal-ink.stamped {
    opacity: 1;
    transform: scale(1) rotate(-8deg);
  }
  .warning-cooldown {
    color: var(--stamp);
    font-weight: 700;
    font-size: 0.85rem;
    margin-top: 10px;
    display: none;
  }
  /* Login Panel inside scanner */
  .scanner-login-overlay {
    position: absolute;
    inset: 0;
    background: #fff;
    border-radius: 24px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
  }
</style>
</head>
<body>

<div class="scanner-card" style="position: relative; overflow: hidden;">
  <!-- Scanner Authentication Overlay -->
  <div class="scanner-login-overlay" id="scanner-auth" style="display: none;">
    <h3 style="font-family:'Cairo'; font-weight:900; margin-bottom: 14px;">تسجيل دخول الموظف 🔐</h3>
    <p style="font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 20px;">الرجاء استخدام البريد وكلمة المرور المحددة لك من قبل التاجر.</p>
    <form onsubmit="handleScannerLogin(event)">
      <div class="form-group" style="text-align: right;">
        <label for="sc-email">البريد الإلكتروني</label>
        <input type="email" id="sc-email" placeholder="staff@business.com" required>
      </div>
      <div class="form-group" style="text-align: right;">
        <label for="sc-password">كلمة المرور</label>
        <input type="password" id="sc-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">دخول وتفعيل الماكينة</button>
    </form>
  </div>

  <div class="scanner-title">بوابة ختم الموظف</div>
  <div class="scanner-subtitle" id="scanner-subtitle">امسح كود العميل لإضافة ختم أو استبدال المكافأة</div>

  <div class="camera-box" id="scanner-camera-sim">
    <div class="scan-laser"></div>
    <div style="font-size: 2.2rem; margin-bottom: 6px;">📷</div>
    <div style="font-size: 0.85rem; opacity: 0.8;">تم العثور على الكاميرا. جاري المسح...</div>
  </div>

  <div class="manual-input-box">
    <label style="display: block; font-weight: 700; margin-bottom: 8px; text-align: right; font-size: 0.9rem;">معرّف بطاقة العميل (المسح أو الإدخال اليدوي):</label>
    <input type="text" id="customerId-input" placeholder="مثال: cust_001" oninput="handleIdChange()">
  </div>

  <div class="stamp-button-container" id="action-panel" style="display: none;">
    <h3 id="customer-identity-label" style="font-family:'Cairo'; font-weight:900;">...</h3>
    <p id="customer-points-label" style="font-weight: 700; color: var(--ink-soft);">...</p>

    <div style="display: flex; gap: 14px; width: 100%;">
      <div class="stamp-btn" id="stamp-trigger-btn" onclick="triggerStamp()">اضغط<br>للختم</div>
      <button class="btn" id="redeem-btn" onclick="triggerRedeem()" style="flex:1; justify-content:center; border:2px solid var(--ink); background: var(--parchment-2);">استبدال<br>الجائزة 🎁</button>
    </div>

    <div class="seal-ink" id="ink-seal">مختوم رقمياً</div>
    <div class="warning-cooldown" id="cooldown-warning">تنبيه حماية: يرجى الانتظار!</div>
  </div>
</div>

<div style="display: flex; gap: 20px; margin-top: 20px;">
  <a href="dashboard.html" class="btn btn-ghost">العودة للوحة التحكم ←</a>
  <button class="btn btn-ghost" id="scanner-logout" onclick="handleScannerLogout()" style="display: none;">خروج الموظف 🔓</button>
</div>

<audio id="stamp-sound" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-84.wav" preload="auto"></audio>

<script>
  let useFallback = false;
  let currentToken = localStorage.getItem('khatm_token') || '';
  let currentUser = null;
  let cooldownTimer = null;

  function getQueryParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
  }

  async function init() {
    try {
      const res = await fetch('/api/public/cards/cust_001');
      useFallback = !res.ok;
    } catch (e) {
      useFallback = true;
    }

    if (currentToken) {
      if (!useFallback) {
        try {
          const res = await fetch('/api/me', {
            headers: { 'Authorization': `Bearer ${currentToken}` }
          });
          if (res.ok) {
            currentUser = await res.json();
            setupStaffView();
          } else {
            promptAuth();
          }
        } catch (e) {
          promptAuth();
        }
      } else {
        const session = JSON.parse(localStorage.getItem('khatm_session_v2'));
        if (session) {
          currentUser = session;
          setupStaffView();
        } else {
          promptAuth();
        }
      }
    } else {
      promptAuth();
    }
  }

  function promptAuth() {
    document.getElementById('scanner-auth').style.display = 'flex';
    document.getElementById('scanner-logout').style.display = 'none';
  }

  function setupStaffView() {
    document.getElementById('scanner-auth').style.display = 'none';
    document.getElementById('scanner-logout').style.display = 'inline-flex';

    if (!currentUser.permissions.canStamp) {
      alert('خطأ: حسابك لا يملك صلاحية ختم بطاقات العملاء.');
      document.getElementById('stamp-trigger-btn').style.opacity = '0.5';
      document.getElementById('stamp-trigger-btn').style.pointerEvents = 'none';
    }

    const idParam = getQueryParam('id');
    if (idParam) {
      document.getElementById('customerId-input').value = idParam;
      document.getElementById('scanner-camera-sim').style.display = 'none';
      document.getElementById('scanner-subtitle').innerText = 'تم التعرف على بطاقة العميل بنجاح!';
      loadCustomerDetails(idParam);
    }
  }

  async function handleScannerLogin(e) {
    e.preventDefault();
    const email = document.getElementById('sc-email').value;
    const password = document.getElementById('sc-password').value;

    if (!useFallback) {
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          currentToken = data.token;
          localStorage.setItem('khatm_token', currentToken);
          const meRes = await fetch('/api/me', {
            headers: { 'Authorization': `Bearer ${currentToken}` }
          });
          currentUser = await meRes.json();
          setupStaffView();
        } else {
          alert(`خطأ: ${data.error}`);
        }
      } catch (err) {
        alert('فشل الاتصال.');
      }
    } else {
      // Local fallback auth
      const db = JSON.parse(localStorage.getItem('khatm_db_v2'));
      const staff = db.merchant_staff.find(s => s.email.toLowerCase() === email.toLowerCase());
      if (!staff) {
        alert('خطأ: البريد أو الباسورد غير صحيح');
        return;
      }
      const merchant = db.merchants.find(m => m.id === staff.merchantId);
      currentUser = {
        id: staff.id,
        merchantId: staff.merchantId,
        name: staff.name,
        email: staff.email,
        businessName: merchant ? merchant.businessName : 'متجر',
        permissions: {
          isOwner: staff.isOwner || false,
          canStamp: staff.canStamp || false,
          canEnrollCustomer: staff.canEnrollCustomer || false,
          canViewReports: staff.canViewReports || false,
          canManageSettings: staff.canManageSettings || false
        }
      };
      localStorage.setItem('khatm_session_v2', JSON.stringify(currentUser));
      localStorage.setItem('khatm_token', `offline_token_${staff.id}`);
      currentToken = `offline_token_${staff.id}`;
      setupStaffView();
    }
  }

  function handleScannerLogout() {
    localStorage.removeItem('khatm_token');
    localStorage.removeItem('khatm_session_v2');
    currentToken = '';
    currentUser = null;
    promptAuth();
  }

  function handleIdChange() {
    const val = document.getElementById('customerId-input').value.trim();
    if (val.length > 3) {
      loadCustomerDetails(val);
    } else {
      document.getElementById('action-panel').style.display = 'none';
    }
  }

  async function loadCustomerDetails(id) {
    let customer = null;
    let card = null;

    if (!useFallback) {
      try {
        const res = await fetch(`/api/public/cards/${id}`);
        if (res.ok) {
          const data = await res.json();
          customer = data.customer;
          card = data.card;
        }
      } catch (err) {
        console.error(err);
      }
    } else {
      const db = JSON.parse(localStorage.getItem('khatm_db_v2'));
      if (db) {
        customer = db.customers.find(c => c.id === id);
        if (customer) {
          card = db.loyalty_cards.find(cd => cd.merchantId === customer.merchantId);
        }
      }
    }

    if (!customer || !card) {
      document.getElementById('customer-identity-label').innerText = 'العميل غير موجود!';
      document.getElementById('customer-points-label').innerText = 'الرجاء التأكد من المعرّف وأن العميل يتبع لنفس منشأتك.';
      document.getElementById('action-panel').style.display = 'block';
      document.getElementById('redeem-btn').style.display = 'none';
      return;
    }

    // Isolate data check
    if (customer.merchantId !== currentUser.merchantId) {
      document.getElementById('customer-identity-label').innerText = 'خطأ أمني: عزل البيانات مفعّل!';
      document.getElementById('customer-points-label').innerText = 'لا ينتمي هذا العميل إلى منشأتك التجارية.';
      document.getElementById('action-panel').style.display = 'block';
      document.getElementById('redeem-btn').style.display = 'none';
      return;
    }

    document.getElementById('customer-identity-label').innerText = `العميل: ${customer.name}`;
    document.getElementById('customer-points-label').innerText = `الأختام الحالية: ${customer.stampsCollected} / ${customer.stampsGoal}`;
    document.getElementById('action-panel').style.display = 'block';

    const stampsGoal = customer.stampsGoal || card.stampsGoal || 10;
    if (customer.stampsCollected >= stampsGoal) {
      document.getElementById('redeem-btn').style.display = 'flex';
      document.getElementById('redeem-btn').style.borderColor = 'var(--brass)';
      document.getElementById('redeem-btn').style.backgroundColor = 'rgba(198,150,58,0.15)';
    } else {
      document.getElementById('redeem-btn').style.display = 'none';
    }
  }

  async function triggerStamp() {
    const id = document.getElementById('customerId-input').value.trim();

    try {
      document.getElementById('stamp-sound').play();
    } catch (e) {}

    const seal = document.getElementById('ink-seal');
    seal.classList.remove('stamped');
    void seal.offsetWidth;
    seal.classList.add('stamped');

    if (!useFallback) {
      try {
        const res = await fetch('/api/stamps', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ customerId: id })
        });
        if (res.ok) {
          setTimeout(() => { loadCustomerDetails(id); }, 300);
        } else {
          const err = await res.json();
          showWarning(err.error);
        }
      } catch (err) {
        console.error(err);
      }
    } else {
      // Fallback local db stamping logic with isolation
      const db = JSON.parse(localStorage.getItem('khatm_db_v2'));
      const customer = db.customers.find(c => c.id === id);

      if (!customer || customer.merchantId !== currentUser.merchantId) {
        showWarning('خطأ: لا يمكن العثور على العميل أو غير مصرح لك');
        return;
      }

      const card = db.loyalty_cards.find(cd => cd.merchantId === currentUser.merchantId);
      const now = new Date();

      if (customer.lastStampedTime) {
        const lastStamped = new Date(customer.lastStampedTime);
        const diffMs = now - lastStamped;
        const diffMins = diffMs / (1000 * 60);
        const cooldownMinutes = card ? card.cooldownMinutes : 1;

        if (diffMins < cooldownMinutes) {
          const waitSeconds = Math.ceil((cooldownMinutes - diffMins) * 60);
          showWarning(`حماية ضد الاحتيال: يرجى الانتظار ${waitSeconds} ثانية.`);
          return;
        }
      }

      customer.stampsCollected += 1;
      customer.lastStampedTime = now.toISOString();

      db.stamps_log.unshift({
        id: `log_${Date.now()}`,
        merchantId: currentUser.merchantId,
        customerId: customer.id,
        customerName: customer.name,
        type: 'stamp',
        timestamp: now.toISOString(),
        details: `تم إضافة ختم. المجموع الحالي: ${customer.stampsCollected} / ${customer.stampsGoal}`
      });

      localStorage.setItem('khatm_db_v2', JSON.stringify(db));
      setTimeout(() => { loadCustomerDetails(id); }, 300);
    }
  }

  async function triggerRedeem() {
    const id = document.getElementById('customerId-input').value.trim();

    if (!useFallback) {
      try {
        const res = await fetch(`/api/customers/${id}/redeem`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        if (res.ok) {
          alert('🎉 تم استرداد المكافأة وتصفير الأختام بنجاح للعميل!');
          loadCustomerDetails(id);
        }
      } catch (err) {
        console.error(err);
      }
    } else {
      const db = JSON.parse(localStorage.getItem('khatm_db_v2'));
      const customer = db.customers.find(c => c.id === id);

      if (!customer || customer.merchantId !== currentUser.merchantId) {
        alert('غير مصرح لك بإتمام هذا الإجراء.');
        return;
      }

      const stampsGoal = customer.stampsGoal || 10;
      customer.stampsCollected -= stampsGoal;
      customer.rewardsClaimed += 1;

      db.stamps_log.unshift({
        id: `log_${Date.now()}`,
        merchantId: currentUser.merchantId,
        customerId: customer.id,
        customerName: customer.name,
        type: 'redeem',
        timestamp: new Date().toISOString(),
        details: `تم استبدال مكافأة بنجاح! الأختام المتبقية: ${customer.stampsCollected}`
      });

      localStorage.setItem('khatm_db_v2', JSON.stringify(db));
      alert('🎉 تم استرداد المكافأة وتصفير الأختام بنجاح للعميل!');
      loadCustomerDetails(id);
    }
  }

  function showWarning(text) {
    const warn = document.getElementById('cooldown-warning');
    warn.innerText = text;
    warn.style.display = 'block';

    if (cooldownTimer) clearTimeout(cooldownTimer);
    cooldownTimer = setTimeout(() => {
      warn.style.display = 'none';
    }, 4000);
  }

  init();
</script>
</body>
</html>
